version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nest_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_api
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nest_db?schema=public
    ports:
      - '3000:3000'
    depends_on:
      - postgres

volumes:
  postgres_data: